{% extends "fragments/layout" %}

{% block body %}

<div class="container">
  <div class="p-5 mb-4 bg-light rounded-3">
    <h1 class="display-5 fw-bold">Underground Albums</h1>
    {% if isAuthenticated %}
    <h1 class="display-4">Saludos, {{ username | default('Usuario') }} </h1>
    {% else %}
    <h1 class="display-4">Saludos, visitante</h1>
    {% endif %}
    <p class="text-center">
      {% if isAdmin %}
      <a class="btn btn-lg btn-primary" href="/admin/albumes/">Ir al Panel de Administración</a>
      {% else %}
      <a class="btn btn-lg btn-success" href="/app/albumes">Comenzar</a>
      {% endif %}
    </p>
  </div>
</div>

{% endblock %}
