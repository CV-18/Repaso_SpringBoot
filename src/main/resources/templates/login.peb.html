{% extends "fragments/layout" %}

{% block body %}

<div class="container mt-5">
  <div class="row justify-content-center">
    <!-- Login Form -->
    <div class="col-md-5 col-lg-4" id="loginbox">
      <div class="card bg-dark border-secondary shadow-lg">
        <div class="card-header bg-black border-bottom border-danger text-center py-3">
          <h4 class="mb-0 text-white text-uppercase fw-bold"><i class="bi bi-box-arrow-in-right text-danger"></i> Acceso</h4>
        </div>
        <div class="card-body p-4">
          <form action="/auth/login" id="loginform" method="POST">
            <input name="{{ csrfParamName }}" type="hidden" value="{{ csrfToken }}">

            <div class="mb-4">
              <label class="form-label text-secondary small text-uppercase fw-bold" for="username">{{ message('auth.username') }}</label>
              <div class="input-group">
                <span class="input-group-text bg-secondary border-secondary text-dark"><i class="bi bi-person-fill"></i></span>
                <input class="form-control bg-black border-secondary text-white" id="login-username" name="username"
                       placeholder="Usuario"
                       required type="text">
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label text-secondary small text-uppercase fw-bold" for="password">{{ message('auth.password') }}</label>
              <div class="input-group">
                <span class="input-group-text bg-secondary border-secondary text-dark"><i class="bi bi-lock-fill"></i></span>
                <input class="form-control bg-black border-secondary text-white" id="login-password" name="password"
                       placeholder="Contraseña"
                       required type="password">
              </div>
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-danger fw-bold py-2" type="submit">
                  ENTRAR <i class="bi bi-chevron-right"></i>
              </button>
            </div>

            <div class="text-center mt-3">
                <a href="#" class="text-secondary small text-decoration-none">¿Olvidaste tu contraseña?</a>
            </div>

          </form>
        </div>
      </div>
    </div>

  </div>
</div>

{% endblock %}
