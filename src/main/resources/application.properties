spring.application.name=Repaso_SpringBoot
application.title=${APPLICATION_TITLE:Albumes API Rest Spring Boot}
application.version=${APPLICATION_VERSION:1.0.0}

server.port=${PORT:3000}
# Versionamos la API
api.version=${API_VERSION:v1}

server.error.include-message=always


logging.level.com.carlosvc.repaso_springboot=DEBUG


spring.datasource.url=jdbc:h2:mem:Albumes


spring.datasource.username=carlos

spring.h2.console.enabled=true




## Carga de Base de Datos
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always


## SQL
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

## Logging
# Para activar los mensajes nivel DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

## JWT
# Configuración de secreto y tiempo de token en segundos (86400 = 24 horas)
jwt.secret=ShrekIsLoveIsLife
jwt.expiration=8600000

## SWAGGER
# Habilitamos swagger, quitar en producción
springdoc.swagger-ui.enabled=true

## GRAPHQL
# Habilitar GraphiQL (playground web)
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
# Configuración del endpoint GraphQL
spring.graphql.http.path=/graphql


##Peeble
pebble.suffix=.peb.html
pebble.cache=false
pebble.charset=UTF-8

## Configuración DevTools
spring.devtools.restart.enabled=false
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.restart.exclude=static/**,public/**
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729

## Configuración i18n (mensajes e internacionalización)
spring.messages.basename=mensajes
spring.messages.encoding=UTF-8
