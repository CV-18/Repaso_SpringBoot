{% extends "fragments/layout" %}

{% block body %}

<div class="container">
  <div class="p-5 mb-4 bg-dark border border-danger border-2 rounded-3 shadow-lg text-center">
    <div class="mb-3">
        <i class="bi bi-music-note-beamed display-1 text-danger"></i>
    </div>
    <h1 class="display-4 fw-bold text-uppercase text-white">Gestión de Albumes</h1>
    <hr class="my-4 border-danger opacity-50">

    {% if isAuthenticated %}
    <h2 class="h3 text-light mb-4">Bienvenido, <span class="text-danger">{{ username | default('Usuario') }}</span> 🤘</h2>
    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <a class="btn btn-danger btn-lg px-4 gap-3" href="/albumes/lista">
            <i class="bi bi-collection-play"></i> Ver Catálogo
        </a>
        <a class="btn btn-outline-light btn-lg px-4" href="/albumes/new">
            <i class="bi bi-plus-lg"></i> Añadir Album
        </a>
    </div>
    {% else %}
    <h2 class="h3 text-light mb-4">Identifícate para entrar al Pit</h2>
    <a class="btn btn-danger btn-lg px-5" href="/auth/login">
        <i class="bi bi-box-arrow-in-right"></i> Entrar
    </a>
    {% endif %}
  </div>
</div>

{% endblock %}
