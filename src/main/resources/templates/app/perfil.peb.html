{% extends "fragments/layout" %}

{% block body %}

<div class="container py-4 mt-5 pt-3">
    <div class="row">
        <div class="col-12 mb-4">
            <h2 class="text-white text-uppercase fw-bold border-start border-5 border-danger ps-3"><i class="bi bi-person-circle text-danger"></i> Mi Perfil</h2>
        </div>
    </div>

    {% if mensaje %}
    <div class="row">
        <div class="col-12">
            <div class="alert alert-success alert-dismissible fade show bg-dark border-success text-white" role="alert">
                <i class="bi bi-check-circle text-success"></i> {{ mensaje }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
            </div>
        </div>
    </div>
    {% endif %}

    <div class="row g-4 justify-content-center">
        <!-- COLUMNA 1: DATOS PERSONALES -->
        <div class="col-lg-8">
            <div class="card bg-dark border-secondary shadow-lg">
                <div class="card-header bg-black border-bottom border-danger text-white">
                    <h5 class="mb-0 text-uppercase"><i class="bi bi-person-fill text-danger"></i> Datos Personales</h5>
                </div>
                <div class="card-body">
                    <!-- Avatar principal -->
                    <div class="text-center mb-4">
                        <h4 class="mt-3 fw-bold text-white">{{ usuario.nombre }} {{ usuario.apellidos }}</h4>
                        {% for rol in usuario.roles %}
                        <span class="badge bg-{% if rol == 'ADMIN' %}danger{% elseif rol == 'MODERATOR' %}warning{% else %}secondary{% endif %} border border-light">
              {{ rol }}</span>
                        {% endfor %}
                    </div>

                    <!-- Formulario editable -->
                    <form method="post" action="/app/perfil/edit">
                        <input type="hidden" name="{{ csrfParamName }}" value="{{ csrfToken }}"/>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-secondary">Nombre</label>
                                <input type="text" class="form-control bg-black border-secondary text-white" name="nombre" value="{{ usuario.nombre }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-secondary">Apellidos</label>
                                <input type="text" class="form-control bg-black border-secondary text-white" name="apellidos" value="{{ usuario.apellidos }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary">Email</label>
                            <input type="email" class="form-control bg-dark border-secondary text-muted" value="{{ usuario.email }}" disabled>
                            <small class="text-muted">El email no se puede modificar</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary">Fecha de Alta</label>
                            <input type="text" class="form-control bg-dark border-secondary text-muted"
                                   value="{{ usuario.createdAt | date('dd/MM/yyyy HH:mm') }}" disabled>
                        </div>

                        <div class="d-flex justify-content-between mt-4 border-top border-secondary pt-3">
                            <a href="/public" class="btn btn-outline-light">
                                <i class="bi bi-arrow-left"></i> Volver
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-save"></i> Actualizar Perfil
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
